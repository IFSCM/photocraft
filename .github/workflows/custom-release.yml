name: Custom PhotoCraft installers

on:
  push:
    tags:
      - 'custom-v*'

permissions:
  contents: write

concurrency:
  group: custom-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux x86_64 (AppImage + DEB)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out PhotoCraft
        uses: actions/checkout@v6

      - name: Check out embedded fonts
        uses: actions/checkout@v6
        with:
          repository: storytold/craft-fonts
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
          path: craft-fonts

      - name: Install Linux packaging dependencies
        uses: storytold/craft-common-actions/actions/install-linux-deps@main
        with:
          deb-arch: amd64
          nfpm-version: '2.47.0'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set build version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#custom-v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a tag like custom-v0.11.2"
            exit 1
          fi
          cargo xtask version set "$VERSION"
          {
            echo "PHOTOCRAFT_VERSION=$VERSION"
            echo "PHOTOCRAFT_BUILD_SHA=$GITHUB_SHA"
            echo "PHOTOCRAFT_BUILD_DATE=$(date -u +%F)"
          } >> "$GITHUB_ENV"

      - name: Test text and PSD I/O fixes
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: '1'
        run: |
          cargo test -p photocraft-text --locked
          cargo test -p photocraft-io --lib --locked

      - name: Build AppImage and DEB
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: '1'
        run: packaging/linux/package.sh --formats 'appimage deb'

      - name: Upload Linux installers
        uses: actions/upload-artifact@v7
        with:
          name: linux-installers
          path: |
            dist/release/photocraft-*-linux-x86_64.AppImage
            dist/release/photocraft-*-linux-x86_64.deb
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows x64 (MSI)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out PhotoCraft
        uses: actions/checkout@v6

      - name: Check out embedded fonts
        uses: actions/checkout@v6
        with:
          repository: storytold/craft-fonts
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
          path: craft-fonts

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install WiX
        uses: storytold/craft-common-actions/actions/install-wix@main
        with:
          wix-version: '5.0.2'

      - name: Set build version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#custom-v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a tag like custom-v0.11.2"
            exit 1
          fi
          cargo xtask version set "$VERSION"
          {
            echo "PHOTOCRAFT_VERSION=$VERSION"
            echo "PHOTOCRAFT_BUILD_SHA=$GITHUB_SHA"
            echo "PHOTOCRAFT_BUILD_DATE=$(date -u +%F)"
          } >> "$GITHUB_ENV"

      - name: Build Windows x64 MSI
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: '1'
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/release/photocraft-*-windows-x64.msi
          if-no-files-found: error
          compression-level: 0

  release:
    name: Create draft GitHub Release
    runs-on: ubuntu-latest
    needs: [linux, windows]
    permissions:
      contents: write
    steps:
      - name: Download Linux installers
        uses: actions/download-artifact@v8
        with:
          name: linux-installers
          path: dist/release

      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: dist/release

      - name: Verify assets and create checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(dist/release/photocraft-*-linux-x86_64.AppImage)
          debs=(dist/release/photocraft-*-linux-x86_64.deb)
          msis=(dist/release/photocraft-*-windows-x64.msi)
          [[ ${#appimages[@]} -eq 1 ]] || { echo 'Expected exactly one Linux AppImage'; exit 1; }
          [[ ${#debs[@]} -eq 1 ]] || { echo 'Expected exactly one Linux DEB'; exit 1; }
          [[ ${#msis[@]} -eq 1 ]] || { echo 'Expected exactly one Windows MSI'; exit 1; }
          sha256sum "${appimages[0]}" "${debs[0]}" "${msis[0]}" > dist/release/SHA256SUMS
          ls -lh dist/release

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/release/photocraft-*-windows-x64.msi \
            dist/release/photocraft-*-linux-x86_64.AppImage \
            dist/release/photocraft-*-linux-x86_64.deb \
            dist/release/SHA256SUMS \
            --draft \
            --title "PhotoCraft custom $GITHUB_REF_NAME" \
            --notes "Unofficial PhotoCraft build from this fork. Includes custom PSD compatibility fixes. Not an official PhotoCraft release. Test installers with copies of important PSD files before relying on them for production work."
